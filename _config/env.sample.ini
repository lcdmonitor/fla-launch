; Template only - placeholder values, never commit real secrets here.
; This file is NOT read by the application (config.inc.php only reads real
; process environment variables via getenv() - there is no .env/.ini-file
; loading mechanism in this app, by design).
;
; Copy the relevant lines into your actual server environment config:
;   - PHP-FPM: paste the env[...] lines below into your pool config
;     (e.g. /etc/php/8.x/fpm/pool.d/www.conf), then restart php-fpm.
;   - Apache + mod_php (this project's local MAMP setup): use SetEnv
;     directives in httpd.conf/vhost instead - see migrations/README.md.

; Required - the app fails loudly (fatal mysqli_sql_exception, etc.) if unset.
env[FLA_DB_USER] = "changeme"
env[FLA_DB_PASS] = "changeme"
env[FLA_EMAIL_USER] = "changeme"
env[FLA_EMAIL_PASSWORD] = "changeme"

; Optional - shown with their built-in fallback values from config.inc.php.
env[FLA_DB_HOST] = "localhost"
env[FLA_DB_NAME] = "web"
env[FLA_DB_PORT] = "8889"
env[FLA_EMAIL_SERVER] = "smtp.office365.com"
env[FLA_EMAIL_FROM] = "support@flalaunch.com"
env[FLA_EMAIL_FROM_NAME] = "Florida Launch Alliance Support"
env[FLA_EMAIL_DEBUG] = "false"
